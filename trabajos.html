<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora ARNA - Trabajos Semanales</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <span class="logo-texto" style="color: white;">Bitácora <span style="color: #FF9800;">ARNA.</span></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Sobre el blog</a></li>
            <li><a href="integrantes.html">Integrantes</a></li>
            <li><a href="trabajos.html" class="btn-activo">Trabajos semanales</a></li>
        </ul>
    </nav>

    <main>
        <section class="seccion-container responsive-layout">
            
            <div class="menu-trabajos">
                <h3 style="color: white; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">Evaluaciones</h3>
                
                <button class="btn-trabajo activo" onclick="cambiarPDF('tarea1.pdf', 'Trabajo 01: Línea de tiempo y análisis de acuerdos', this)">
                    <span class="icono">❂</span> Trabajo 01
                </button>
                
                <button class="btn-trabajo" onclick="cambiarPDF('tarea2.pdf', 'Trabajo 02: Recursos Renovables y No Renovables del Perú', this)">
                    <span class="icono">❂</span> Trabajo 02
                </button>
                
                <button class="btn-trabajo" onclick="cambiarPDF('tarea3.pdf', 'Trabajo 03: La biodiversidad peruana: ¿activo estratégico o patrimonio en riesgo?', this)">
                    <span class="icono">❂</span> Trabajo 03
                </button>

                <button class="btn-trabajo" onclick="cambiarPDF('tarea4.pdf', 'Trabajo 04: Efectos del Cambio Climático y Vulnerabilidad en el Perú: Riesgos en Poblaciones y Biodiversidad', this)">
                    <span class="icono">❂</span> Trabajo 04
                </button>

                <button class="btn-trabajo" onclick="cambiarPDF('tarea5.pdf', 'Trabajo 05: Los poderes del Estado en el Perú: Cuadro Comparativo', this)">
                    <span class="icono">❂</span> Trabajo 05
                </button>
                 <button class="btn-trabajo" onclick="cambiarPDF('E1.pdf', 'Evaluación Contínua 1: Análisis de las Problemáticas Socioambientales del Perú', this)">
                    <span class="icono">❂</span> Evaluación Continua 1
                </button>

                 <button class="btn-trabajo" onclick="cambiarPDF('e1-presentacion.pdf', 'Presentación E1: Análisis de las Problemáticas Socioambientales del Perú', this)">
                    <span class="icono">❂</span> Exposición E1
                </button>

                <button class="btn-trabajo" onclick="cambiarPDF('herramientas_digitales.pdf', 'Herramientas Digitales', this)">
                    <span class="icono">❂</span> Herramientas digitales
                </button>
                
            </div>

            <div class="visor-trabajos">
                <h3 id="titulo-trabajo" style="color: white;">Trabajo 01: Efectos del Cambio Climático y Vulnerabilidad</h3>
                
                <div class="iframe-container">
                    <iframe id="pdf-viewer" src="tarea1.pdf" width="100%" height="100%">
                        Tu navegador no soporta la visualización de PDFs. 
                    </iframe>
                </div>
            </div>

        </section>
    </main>

    <script>
        function cambiarPDF(archivo, titulo, botonClickeado) {
            document.getElementById('pdf-viewer').src = archivo;
            document.getElementById('titulo-trabajo').innerText = titulo;
            let botones = document.querySelectorAll('.btn-trabajo');
            botones.forEach(function(btn) {
                btn.classList.remove('activo');
            });
            botonClickeado.classList.add('activo');
        }
    </script>

</body>
</html>
