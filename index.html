<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora ARNA - Trabajos Semanales</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <span class="logo-icono">❂</span>
            <span class="logo-texto">Bitácora ARNA.</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Sobre el blog</a></li>
            <li><a href="integrantes.html">Integrantes</a></li>
            <li><a href="trabajos.html" class="btn-activo">Trabajos semanales</a></li>
        </ul>
    </nav>

    <main>
        <section class="seccion-container responsive-layout">
            
            <div class="menu-trabajos">
                <h3>Semanas</h3>
                <button class="btn-trabajo activo" onclick="cambiarPDF('tarea_mapa.pdf', 'Semana 1: Efectos del Cambio Climático y Vulnerabilidad', this)">Semana 1</button>
                <button class="btn-trabajo" onclick="cambiarPDF('ejemplo2.pdf', 'Semana 2: Título de la tarea 2', this)">Semana 2</button>
                <button class="btn-trabajo" onclick="cambiarPDF('ejemplo3.pdf', 'Semana 3: Título de la tarea 3', this)">Semana 3</button>
            </div>

            <div class="visor-trabajos">
                <h3 id="titulo-trabajo">Semana 1: Efectos del Cambio Climático y Vulnerabilidad</h3>
                <div class="iframe-container">
                    <iframe id="pdf-viewer" src="tarea_mapa.pdf" width="100%" height="100%">
                        Tu navegador no soporta la visualización de PDFs. 
                    </iframe>
                </div>
            </div>

        </section>
    </main>

    <script>
        function cambiarPDF(archivo, titulo, botonClickeado) {
            document.getElementById('pdf-viewer').src = archivo;
            document.getElementById('titulo-trabajo').innerText = titulo;
            let botones = document.querySelectorAll('.btn-trabajo');
            botones.forEach(function(btn) {
                btn.classList.remove('activo');
            });
            botonClickeado.classList.add('activo');
        }
    </script>

</body>
</html>
